name: time_picker_pro
description: "A highly customizable Flutter custom clock time picker featuring seconds selection and 24-hour format support."
version: 0.0.6
homepage: https://github.com/flutter-tamilnadu/time_picker_pro
repository: https://github.com/flutter-tamilnadu/time_picker_pro
issue_tracker: https://github.com/flutter-tamilnadu/time_picker_pro/issues

screenshots:
  - description: "Modern white themed clock time picker dialog."
    path: assets/screenshot_1.png
  - description: "Light themed custom color selection on ClockTimePicker."
    path: assets/screenshot_2.png
  - description: "Vibrant dark theme clock time picker layout."
    path: assets/screenshot_3.png
  - description: "Standard white theme style with subtle radial highlight."
    path: assets/screenshot_4.png
  - description: "Customized hours and minutes pointer styles in dark mode."
    path: assets/screenshot_5.png

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

